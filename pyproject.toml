[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "BLE", "RUF"]
ignore = [
    "RUF001", # ambiguous unicode in strings (intentional typography: em dashes, math minus)
]

[tool.ruff.lint.isort]
known-first-party = ["finrisk", "study"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"] # long assertion messages are fine in tests

[tool.pytest.ini_options]
testpaths = ["tests"]
